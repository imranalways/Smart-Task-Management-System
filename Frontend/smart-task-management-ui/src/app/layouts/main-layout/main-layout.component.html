
<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-layer-group"></i>
      </div>

      <div class="brand-text">
        <h5>Smart Task</h5>
        <span>Management System</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-navigation">

      <span class="nav-section-title">WORKSPACE</span>

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link">

        <i class="fa-solid fa-chart-pie"></i>
        <span>Dashboard</span>
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="active"
        class="nav-link">

        <i class="fa-solid fa-folder-open"></i>
        <span>Projects</span>
      </a>

      <a
        routerLink="/tasks"
        routerLinkActive="active"
        class="nav-link">

        <i class="fa-solid fa-list-check"></i>
        <span>My Tasks</span>
      </a>

      @if (auth.getRole() === 'Admin' || auth.getRole() === 'ProjectManager') {
        <a
          routerLink="/team"
          routerLinkActive="active"
          class="nav-link">

          <i class="fa-solid fa-users"></i>
          <span>Team Members</span>
        </a>
      }

      <!-- Admin Only -->
      @if (auth.getRole() === 'Admin') {
        <a
          routerLink="/user-roles"
          routerLinkActive="active"
          class="nav-link">

          <i class="fa-solid fa-user-shield"></i>
          <span>User Roles</span>
        </a>
      }

    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">

      <div class="sidebar-footer-info">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Secure Workspace</span>
      </div>

    </div>

  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Topbar -->
    <header class="topbar">

      <div class="topbar-left">
        <span class="topbar-label"></span>
        <h6></h6>
      </div>

      <!-- User Profile Dropdown -->
      <div class="topbar-user-container">

        <button
          type="button"
          class="topbar-user-trigger"
          [class.active]="userMenuOpen"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen"
          aria-haspopup="true"
          aria-label="Open user menu">

          <div class="topbar-avatar">
            <i class="fa-solid fa-user"></i>
          </div>

          <div class="topbar-user-info">
            <strong>{{ auth.getUserName() }}</strong>
            <span>{{ auth.getRole() }}</span>
          </div>

          <i
            class="fa-solid fa-chevron-down dropdown-arrow"
            [class.rotated]="userMenuOpen">
          </i>

        </button>

        <!-- Dropdown Menu -->
        @if (userMenuOpen) {
          <div class="user-dropdown">

            <div class="dropdown-user-info">
              <div class="dropdown-avatar">
                <i class="fa-solid fa-user"></i>
              </div>

              <div>
                <strong>{{ auth.getUserName() }}</strong>
                <span>{{ auth.getRole() }}</span>
              </div>
            </div>

            <div class="dropdown-divider"></div>

            <button
              type="button"
              class="dropdown-logout"
              (click)="logout()">

              <i class="fa-solid fa-right-from-bracket"></i>
              <span>Logout</span>
            </button>

          </div>
        }

      </div>

    </header>

    <!-- Page Content -->
    <section class="page-content">
      <router-outlet></router-outlet>
    </section>

  </main>

</div>
